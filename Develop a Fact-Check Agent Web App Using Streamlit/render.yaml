services:
  - type: web
    name: fact-check-agent
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_BASE
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
